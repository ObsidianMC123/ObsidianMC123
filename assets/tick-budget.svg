<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="One tick has a 50 ms budget. The spike used 620 ms.">
  <defs>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" fill="#0D1117"/>
  <rect width="1000" height="230" fill="url(#g2)"/>

  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681" letter-spacing="1.8">A SERVER TICK HAS 50 MS. THE STALL USED 620.</text>

  <g transform="translate(150,66)">
    <line x1="59" y1="-6" x2="59" y2="126" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="64" y="-12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8B949E">50 ms budget</text>

    <text x="-110" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8B949E">BEFORE</text>
    <rect x="0" y="10" width="0" height="26" rx="3" fill="url(#bad)">
      <animate attributeName="width" from="0" to="727" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="742" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#A78BFA">620 ms</text>

    <text x="-110" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8B949E">AFTER</text>
    <rect x="0" y="70" width="0" height="26" rx="3" fill="#238636">
      <animate attributeName="width" from="0" to="55" dur="1.5s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="70" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#3FB950">inside the budget</text>
  </g>

  <text x="40" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681">root cause: isChunkGenerated called 300-500x per cycle, blocking region-file I/O on the main thread</text>
  <text x="40" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681">TPS 17.3 -&gt; 19.5</text>
  <rect x="0" y="226" width="1000" height="4" fill="#161B22"/>
</svg>
