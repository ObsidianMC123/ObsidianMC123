    <text x="450" y="281" font-size="10.5" fill="#6E7681" text-anchor="middle">GitHub releases, SHA-1 verified</text>

    <line x1="220" y1="145" x2="322" y2="145" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a2)"/>
