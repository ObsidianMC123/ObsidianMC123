    <text x="944" y="145" font-size="11" fill="#6E7681" text-anchor="end">Java</text>

    <rect x="680" y="176" width="280" height="52" rx="6" fill="#161B22" stroke="#21262D"/>
    <text x="700" y="207" font-size="12.5" fill="#E6EDF3">ZAS</text>
    <text x="944" y="207" font-size="11" fill="#6E7681" text-anchor="end">Kotlin</text>

    <rect x="680" y="238" width="280" height="52" rx="6" fill="#161B22" stroke="#21262D"/>
    <text x="700" y="269" font-size="12.5" fill="#E6EDF3">zombie-datapack-remake</text>
