  </defs>

  <rect width="1000" height="320" fill="#0D1117"/>
  <rect width="1000" height="320" fill="url(#g4)"/>

  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681" letter-spacing="1.8">SIVI &#183; WHAT I RUN AND WHAT I WROTE</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="122" width="180" height="66" rx="6" fill="#161B22" stroke="#21262D"/>
