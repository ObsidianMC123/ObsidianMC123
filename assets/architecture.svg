<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="SIVI server architecture: Paper server, plugins, datapack and the GitHub-hosted resource pack chain">
  <defs>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#6E7681"/>
